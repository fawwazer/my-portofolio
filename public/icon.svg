<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="1" stop-color="#090D16"/>
    </linearGradient>

    <linearGradient id="accent-grad" x1="0" y1="0" x2="512" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10B981"/>
      <stop offset="0.5" stop-color="#14B8A6"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <!-- Card Frame -->
  <rect width="512" height="512" rx="140" fill="url(#bg-grad)"/>
  <rect x="16" y="16" width="480" height="480" rx="124" stroke="url(#accent-grad)" stroke-width="8" stroke-opacity="0.4"/>

  <!-- Terminal Bracket Accent -->
  <path d="M130 170L70 256L130 342" stroke="#10B981" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M382 170L442 256L382 342" stroke="#06B6D4" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Bold MNF Core Text -->
  <text x="256" y="295" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="130" fill="#F8FAFC" text-anchor="middle" letter-spacing="2">
    MNF
  </text>
  
  <!-- Subtitle Line -->
  <rect x="180" y="345" width="152" height="10" rx="5" fill="url(#accent-grad)" />
</svg>
